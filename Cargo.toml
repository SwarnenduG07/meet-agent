[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
chromiumoxide = "0.9"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "net", "sync", "io-util", "io-std", "signal"] }
tokio-tungstenite = "0.30"
cpal = "0.18"
ort = "=2.0.0-rc.15"
whisper-rs = { version = "0.16", features = ["metal"] }
rustfft = "6"
hound = "3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
brain-client = { path = "crates/brain-client" }
meet = { path = "crates/meet" }
desktop = { path = "crates/desktop" }
audio = { path = "crates/audio" }
speech = { path = "crates/speech" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
