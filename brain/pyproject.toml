[project]
name = "brain-server"
version = "0.1.0"
description = "Python brain server for meet-agent: keeps Qwen3-VL loaded and answers think()."
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlx-vlm",
  "torch",
  "torchvision",
  "websockets",
]

[project.scripts]
brain-server = "brain_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain_server"]
