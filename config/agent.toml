# Settings for meet-agent. Paths starting with ~/ are expanded.

[paths]
hf_cache = "~/.cache/huggingface/hub"
runs = "runs"

[chrome]
binary = "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
profile_dir = "~/meet-agent-chrome"   # holds the agent's Google sign-in; never your personal profile
debug_port = 9222                     # bound to 127.0.0.1 only
share_source = "Screen 1"             # "Screen 1" / "Screen 2" with two displays, "Entire screen" with one

[audio]
call_input = "BlackHole 16ch"         # Meet's speaker → the agent hears the call
agent_output = "BlackHole 2ch"        # the agent's voice → Meet's microphone
meet_speaker = "Meet Output"          # Multi-Output device: your headphones + BlackHole 16ch
monitor_output = ""                   # your headphones; empty = system default output
listen_input = ""                     # `meet-agent listen`: mic; empty = system default

[brain]
project = "brain"                     # the Python uv project
model = "mlx-community/Qwen3-VL-8B-Instruct-4bit"
port = 8790
startup_timeout_secs = 180
name = "Sunny's meet agent"           # how the agent introduces itself
owner = "Sunny"                       # whose meetings these are

[meet]
labels = "config/meet-labels.toml"     # Meet button labels
admit_timeout_secs = 300              # give up if nobody admits the agent

# Model files in the Hugging Face cache (the brain is set above).
[models]
vad = { repo = "onnx-community/silero-vad", file = "onnx/model.onnx" }
smart_turn = { repo = "pipecat-ai/smart-turn-v3", file = "smart-turn-v3.2-cpu.onnx" }
whisper = { repo = "ggerganov/whisper.cpp", file = "ggml-large-v3-turbo-q8_0.bin" }
tts = { repo = "onnx-community/Kokoro-82M-v1.0-ONNX", file = "onnx/model.onnx" }

[speech]
voice = "af_heart"                    # Kokoro voice file in voices/
tts_threads = 8                       # CPU threads for Kokoro (8: ~0.5 s per sentence)
# Words Whisper should expect, so names aren't misheard ("meet" vs "meat").
expect_words = "Google Meet, meet agent, Sunny, Flowline, Rust API, Next.js, Supabase, Nango."
